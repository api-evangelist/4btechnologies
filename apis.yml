aid: 4btechnologies
name: Business Leads World
description: >-
  Business Leads World is a US lead-generation and B2B data company serving the alternative
  business-finance market. Operating since 2016 from Queens, New York, it supplies merchant cash
  advance (MCA) and business loan leads to lenders, ISOs, funding companies and loan brokers —
  MCA live-transfer calls, call-back leads, aged MCA leads, business loan leads, digital marketing
  leads and B2B email data. Leads are sourced through SEO, PPC and email marketing and pre-qualified
  against published criteria (credit score above 550, no bankruptcies, at least one year in business,
  and monthly bank deposits above $15,000). The company sells lead lists through a self-service
  storefront on its own website; it publishes no public developer program, API reference or
  machine-readable API contract.
